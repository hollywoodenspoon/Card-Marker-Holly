# Build the desktop and Android apps and publish them as a GitHub Release, tagged
# v<package.json version>. Start it either way:
#   - Actions tab → "Release" → Run workflow (on main); the tag is created for you
#   - or push a matching tag: git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# Versions with -alpha / -beta / -rc are published as pre-releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (untick to only build the files)
        type: boolean
        default: true

permissions:
  contents: write

env:
  # This run publishes a release (so the Android app must be signed with the real key).
  PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main') }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage pacman
          - os: windows-latest
            args: --win portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - run: npm run desktop:dist -- ${{ matrix.args }}
        env:
          # Only to read the repo's releases while building; nothing is published here.
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.pkg.tar.xz
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      # The key is kept as repo secrets (README → Android app → Signing key).
      # Without the key, a release goes out without the APK (never with an unsigned one).
      - name: Signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "apk=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISHING" = "true" ]; then
            echo "::warning::Android APK skipped: no signing key yet (README → Android app → Signing key)."
            echo "apk=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key: this trial APK is signed with a debug key and is not for sharing."
            echo "apk=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.apk == 'true'
        run: npm run android:apk
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: steps.key.outputs.apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    # Releases come from tags or from main only (the same rule as PUBLISHING above;
    # a job's `if` can't read env).
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          pre=""
          case "$tag" in *-alpha*|*-beta*|*-rc*) pre="--prerelease" ;; esac
          notes=.github/release-notes.md
          # No APK this time (no signing key yet): leave Android out of the notes.
          if ! ls out/*.apk >/dev/null 2>&1; then
            grep -v '^- \*\*Android' "$notes" > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          # Creates the tag on this commit when it does not exist yet.
          gh release create "$tag" out/* $pre --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
