# Build the desktop app and publish it as a GitHub Release.
# Start it by pushing a tag that matches package.json, e.g.:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# Versions with -alpha / -beta are published as pre-releases.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage pacman
          - os: windows-latest
            args: --win portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - run: npm run desktop:dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.pkg.tar.xz
            release/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          pre=""
          case "$tag" in *-alpha*|*-beta*|*-rc*) pre="--prerelease" ;; esac
          gh release create "$tag" out/* $pre --title "$tag" --notes-file .github/release-notes.md
