# Build the desktop apps and publish them as a GitHub Release, tagged
# v<package.json version>. Start it either way:
#   - Actions tab → "Release" → Run workflow (on main); the tag is created for you
#   - or push a matching tag: git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# Versions with -alpha / -beta / -rc are published as pre-releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (untick to only build the files)
        type: boolean
        default: true
      pacman_only:
        description: Only build the Arch package and update the pacman repository (no Windows, no AppImage, no versioned release)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing doesn't cancel the other's build.
      fail-fast: false
      # Windows: the targets in electron-builder.yml (Setup and portable). A pacman-only run
      # builds just the Arch package (tag pushes have no inputs, so they always build everything).
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.pacman_only && '[{"os":"ubuntu-latest","args":"--linux pacman"}]' || '[{"os":"ubuntu-latest","args":"--linux AppImage pacman"},{"os":"windows-latest","args":"--win"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - run: npm run desktop:dist -- ${{ matrix.args }}
        env:
          # Only to read the repo's releases while building; nothing is published here.
          GH_TOKEN: ${{ github.token }}
      # The Arch package goes into a pacman repository (see the publish job); check it builds one.
      - name: Check the pacman repository
        if: runner.os == 'Linux'
        run: |
          mkdir -p pacman-check && cp release/*.pkg.tar.xz pacman-check/
          docker run --rm -v "$PWD/pacman-check:/repo" -w /repo archlinux:latest \
            sh -c 'repo-add cardworks.db.tar.gz *.pkg.tar.xz && pacman -Qip *.pkg.tar.xz | grep -E "^(Name|Provides|Conflicts|Replaces)"'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.pkg.tar.xz
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: [build]
    # Releases come from tags or from main only.
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        if: ${{ !inputs.pacman_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          pre=""
          case "$tag" in *-alpha*|*-beta*|*-rc*) pre="--prerelease" ;; esac
          notes=.github/release-notes.md
          # Creates the tag on this commit when it does not exist yet.
          gh release create "$tag" out/* $pre --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
      # The pacman repository lives in the fixed "pacman-repo" release (a pre-release, so
      # never "latest"; the app's update check skips it). It holds only the newest package.
      # Users add it once to /etc/pacman.conf (README → Arch / CachyOS).
      - name: Update the pacman repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo && cp out/*.pkg.tar.xz repo/
          docker run --rm -v "$PWD/repo:/repo" -w /repo archlinux:latest \
            sh -c 'repo-add cardworks.db.tar.gz *.pkg.tar.xz'
          # GitHub release files can't be symlinks: store the databases under both names.
          cd repo
          cp --remove-destination cardworks.db.tar.gz cardworks.db
          cp --remove-destination cardworks.files.tar.gz cardworks.files
          gh release view pacman-repo >/dev/null 2>&1 || gh release create pacman-repo --prerelease \
            --target "$GITHUB_SHA" --title "Arch / CachyOS package repository" \
            --notes "pacman repository for Hearthside Cardworks. Add it to /etc/pacman.conf as described in the README; you don't need to download anything here."
          for a in $(gh release view pacman-repo --json assets -q '.assets[].name'); do
            gh release delete-asset pacman-repo "$a" -y
          done
          gh release upload pacman-repo ./* --clobber
