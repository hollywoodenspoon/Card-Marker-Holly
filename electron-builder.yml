# Desktop packages: `npm run desktop:dist` (or the Release workflow).
# productName is the working title; change it together with APP_NAME in src/app/appInfo.ts.
# appId stays fixed so a rename never loses settings.
appId: io.github.hollywoodenspoon.cardmaker
productName: Hearthside Cardworks
copyright: Copyright © 2026 Hanielle Marie N. Armas. All rights reserved.

directories:
  output: release

# Everything is bundled by Vite, so the app needs no node_modules at all.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules/**/*'
asar: true
# The licence and the third-party notices sit next to the program.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: public/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# Updates come from GitHub Releases (only when the user turns them on). CI builds with
# --publish never and the Release workflow uploads the files, including latest*.yml.
publish:
  provider: github
  owner: hollywoodenspoon
  repo: Card-Marker-Holly

linux:
  target:
    - AppImage
    - pacman
  category: Graphics
  icon: public/pwa-512.png
  maintainer: Hanielle Marie N. Armas
  synopsis: Design cards and print them on A4 sheets
  artifactName: hearthside-cardworks-${version}-${arch}.${ext}

# Arch / CachyOS names for what the bundled Electron needs from the system.
# Renamed from card-maker: pacman swaps the old package for this one on update.
pacman:
  packageName: hearthside-cardworks
  artifactName: hearthside-cardworks-${version}-${arch}.pkg.tar.xz
  fpm:
    - --replaces=card-maker
    - --conflicts=card-maker
    - --provides=card-maker
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxtst
    - xdg-utils

win:
  target:
    - nsis
    - portable
  icon: public/pwa-512.png

# The installer updates itself: per user (no admin rights), installs in a few seconds.
nsis:
  oneClick: true
  perMachine: false
  artifactName: Hearthside-Cardworks-Setup-${version}.exe

# One self-contained exe: no installer, no admin rights; data stays next to it.
# It can't replace itself, so it only says when a new version is out.
portable:
  artifactName: Hearthside-Cardworks-${version}-portable.exe
